name: Tender Email Bot

on:
  schedule:
    # Runs daily at 5:17 AM UTC (10:47 AM IST)
     - cron: '17 5 * * *'
  # Allows manual triggering from the GitHub Actions UI
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Playwright Browsers
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl pydantic google-genai
          playwright install --with-deps chromium

      - name: Run Tender Automation Script
        env:
          TENDER_USERNAME: ${{ secrets.TENDER_USERNAME }}
          TENDER_PASSWORD: ${{ secrets.TENDER_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
