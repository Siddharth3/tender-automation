name: Tender Email Bot

on:
  schedule:
    # Runs daily at 3:00 AM UTC (8:30 AM IST). Adjust cron time if needed.
    - cron: '0 3 * * *'
  # Enables a "Run workflow" button on GitHub so you can run it manually anytime
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Playwright Browsers
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Tender Automation Script
        env:
          TENDER_USERNAME: ${{ secrets.TENDER_USERNAME }}
          TENDER_PASSWORD: ${{ secrets.TENDER_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python main.py
